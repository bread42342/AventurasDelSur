{% extends 'base.html' %}
{% block titulo %}Experiencia{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">{% if object %}Editar experiencia{% else %}Nueva experiencia{% endif %}</h1>
<div class="row">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include 'parciales/camposFormulario.html' %}
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{% url 'experiencia_lista' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
