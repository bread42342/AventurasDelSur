{% extends 'base.html' %}
{% block titulo %}Valorar experiencia{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Valorar: {{ object.experiencia.titulo }}</h1>
<div class="row">
    <div class="col-lg-6">
        <div class="card shadow mb-4">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include 'parciales/camposFormulario.html' %}
                    <button type="submit" class="btn btn-warning">Enviar valoración</button>
                    <a href="{% url 'mis_reservas' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
