{% extends 'base.html' %}
{% block titulo %}Reserva{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Editar reserva</h1>
<div class="row">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-body">
                <p class="small text-gray-700">{{ object.usuario.get_full_name|default:object.usuario.username }} &middot; {{ object.experiencia.titulo }}</p>
                <form method="post">
                    {% csrf_token %}
                    {% include 'parciales/camposFormulario.html' %}
                    <button type="submit" class="btn btn-danger">Guardar</button>
                    <a href="{% url 'inscripcion_lista' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
