{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block titulo %}Aventuras del Sur{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/aventuras.css' %}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-8 col-md-10">
                <div class="text-center mt-5">
                    <a href="{% url 'inicio' %}" class="text-white text-decoration-none">
                        <h1 class="h3 mt-2 font-weight-bold">Aventuras del Sur</h1>
                    </a>
                </div>
                <div class="card o-hidden border-0 shadow-lg my-4">
                    <div class="card-body p-5">
                        {% include 'parciales/mensajes.html' %}
                        {% block contenido %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
