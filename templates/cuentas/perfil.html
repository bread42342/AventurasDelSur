{% extends 'base.html' %}
{% block titulo %}Mi perfil{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Mi perfil</h1>
<div class="row">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Datos personales ({{ user.get_rol_display }})</h6></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include 'parciales/camposFormulario.html' %}
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
