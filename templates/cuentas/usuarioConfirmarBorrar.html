{% extends 'base.html' %}
{% block titulo %}Eliminar usuario{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4 text-gray-800">Eliminar usuario</h1>
<div class="card shadow mb-4">
    <div class="card-body">
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <p>¿Seguro que deseas eliminar a <strong>{{ object.username }}</strong>? También se eliminarán sus reservas.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Eliminar</button>
            <a href="{% url 'usuario_lista' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
